<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  System bus for the GNOME session inside Linux Lab.
  There is no init system here, so the bus runs as the desktop user and lets that user own any name.
  Services are started on demand by service-helper (through sudo), which also decides which of them
  can work here at all.
-->
<busconfig>
  <type>system</type>
  <listen>unix:path=/run/dbus/system_bus_socket</listen>
  <standard_system_servicedirs/>
  <servicehelper>/opt/linuxlab-gnome/service-helper</servicehelper>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow user="*"/>
    <allow own="*"/>
    <allow send_destination="*" eavesdrop="true"/>
    <allow receive_sender="*"/>
    <allow send_type="method_call"/>
    <allow send_type="signal"/>
    <allow send_type="method_return"/>
    <allow send_type="error"/>
  </policy>
</busconfig>
